name: Deploy demos to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build solution
        working-directory: code/f1872707871b2c/solution
        env:
          PAGES_BASE: /zenn-articles/f1872707871b2c/solution/
        run: |
          npm ci
          # .npmrc の ignore-scripts=true をここで打ち消す（esbuild などのネイティブ依存に必要）
          npm rebuild
          npm run build

      - name: Build state-machine
        working-directory: code/f1872707871b2c/state-machine
        env:
          PAGES_BASE: /zenn-articles/f1872707871b2c/state-machine/
        run: |
          npm ci
          npm rebuild
          npm run build

      - name: Assemble artifact
        run: |
          mkdir -p _pages/f1872707871b2c/solution
          mkdir -p _pages/f1872707871b2c/state-machine
          cp -r code/f1872707871b2c/solution/dist/. _pages/f1872707871b2c/solution/
          cp -r code/f1872707871b2c/state-machine/dist/. _pages/f1872707871b2c/state-machine/
          cat > _pages/index.html <<'EOF'
          <!doctype html>
          <html lang="ja">
            <head>
              <meta charset="utf-8" />
              <title>zenn-articles demos</title>
              <style>
                body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 20px; color: #111; }
                h1 { font-size: 1.5rem; }
                h2 { font-size: 1.1rem; margin-top: 2rem; }
                a { color: #1d4ed8; }
                ul { line-height: 1.9; }
                .note { color: #6b7280; font-size: 0.9rem; }
              </style>
            </head>
            <body>
              <h1>zenn-articles demos</h1>
              <h2>複雑な入力フォームの設計 (f1872707871b2c)</h2>
              <ul>
                <li><a href="./f1872707871b2c/solution/">solution</a> — 導出パターン（推奨）</li>
                <li><a href="./f1872707871b2c/state-machine/">state-machine</a> — 失敗パターン（xstate 版）</li>
              </ul>
              <p class="note">
                ソース:
                <a href="https://github.com/WATA-Haru/zenn-articles">WATA-Haru/zenn-articles</a>
              </p>
            </body>
          </html>
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages

      - uses: actions/deploy-pages@v4
        id: deployment
